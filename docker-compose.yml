version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: raymed-postgres
    environment:
      POSTGRES_USER: raymed
      POSTGRES_PASSWORD: raymed123
      POSTGRES_DB: raymed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raymed -d raymed"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raymed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Para desenvolvimento local - descomente se quiser rodar os apps via Docker
  # web:
